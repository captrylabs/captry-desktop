# Checks every hour that captry.app/desktop serves exactly the newest release
# published here. Every run is public under Actions. When the page fails to
# match three times in a row it opens an issue, so a mismatch is on the record,
# not just in an inbox; when the site matches again, that issue is closed. A run
# that could not look at all (the site down, or refusing GitHub's machines)
# fails without an issue, as that says nothing about the page; but six hours of
# failed runs in a row open one of their own, so no check going on is on the
# record too.

name: Verify captry.app/desktop

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the live page against releases.json
        id: check
        shell: bash
        run: |
          # A network blip or a deploy still reaching every edge is not a mismatch:
          # three tries, a minute apart.
          for attempt in 1 2 3; do
            set +e
            node verify.mjs > result.txt
            code=$?
            set -e
            cat result.txt
            if [ "$code" = 0 ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" = 3 ] || sleep 60
          done
          # 1: the page does not match. 2: it could not be checked.
          if [ "$code" = 1 ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=unknown" >> "$GITHUB_OUTPUT"; fi
          exit 1

      - name: Open an issue on a mismatch
        if: failure() && steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="captry.app/desktop does not match a published release"
          body=$(printf 'The hourly check failed three times in a row.\n\n```\n%s\n```\n\nRun: %s' "$(cat result.txt)" "$RUN")
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Open an issue when it has not been checked for six hours
        if: failure() && steps.check.outputs.ok == 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          # This run, and the five before it, all failed.
          failed=$(gh run list --workflow verify.yml --status completed --limit 5 --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')
          [ "$failed" = 5 ] || exit 0
          title="captry.app/desktop could not be checked"
          body=$(printf 'The hourly check has not passed for six runs in a row.\n\n```\n%s\n```\n\nRun: %s' "$(cat result.txt)" "$RUN")
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the issues once the site matches again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          for title in "captry.app/desktop does not match a published release" "captry.app/desktop could not be checked"; do
            open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The check passes again: $RUN"
            fi
          done
